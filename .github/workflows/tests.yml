name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t football-predictor .
      - name: Start the dashboard and wait until it answers
        run: |
          docker run -d --name app -p 8501:8501 football-predictor
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " - dashboard is up"; exit 0; fi
            sleep 2
          done
          echo "Dashboard did not start"; docker logs app; exit 1
